name: Extract blog source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip site
        run: |
          unzip -o flickpicksdeals-blog-nov08-cleaning.zip
          rm -f flickpicksdeals-blog-nov08-cleaning.zip
          rm -f .github/workflows/extract.yml
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update blog: Cleaning badge, remove Pick a lane, slower ticker (127 products)" || echo "nothing to commit"
          git push

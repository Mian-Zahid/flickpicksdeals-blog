name: Deploy blog to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Sanity-check + clean junk from assets
        run: |
          test -f site/index.html || (echo "site/index.html missing" && exit 1)
          test -f site/sitemap.xml || (echo "site/sitemap.xml missing" && exit 1)
          find site -name "*.zip" -delete
          find site -name ".DS_Store" -delete
          echo "assets size:"; du -sh site
          echo "pages:"; find site -name "index.html" | wc -l

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=flickpicksdeals
